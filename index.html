<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista de precios interactiva con calculadora de pedidos. Cacahuates, botanas, frutos secos, frutas deshidratadas y gomitas.">
    <meta name="keywords" content="lista de precios, cacahuates, botanas, frutos secos, gomitas, pedidos">
    <meta name="author" content="Lista de Precios">
    <meta name="theme-color" content="#667eea">
    
    <meta property="og:title" content="Lista de Precios - Catálogo Interactivo">
    <meta property="og:description" content="Explora nuestro catálogo de productos y crea tu pedido fácilmente.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_MX">
    
    <title>Lista de Precios - Catálogo Interactivo</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥜</text></svg>">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="toast-container" id="toastContainer" role="alert" aria-live="polite"></div>
    
    <div class="container">
        <div class="header">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" aria-label="Cambiar tema">🌙</button>
            <h1>🥜 Lista de Precios</h1>
            <p>Todos los productos en presentación de 100g</p>
        </div>

        <div class="controls-bar">
            <div class="search-box">
                <label for="searchInput" class="sr-only">Buscar producto</label>
                <input type="text" id="searchInput" placeholder="🔍 Buscar producto..." aria-label="Buscar producto">
            </div>
            
            <div class="filter-group">
                <label for="priceMin">$</label>
                <input type="number" id="priceMin" placeholder="Mín" min="0" step="1" aria-label="Precio mínimo">
                <label for="priceMax">a $</label>
                <input type="number" id="priceMax" placeholder="Máx" min="0" step="1" aria-label="Precio máximo">
            </div>
            
            <div class="filter-group">
                <label for="sortBy">Ordenar:</label>
                <select id="sortBy" aria-label="Ordenar por">
                    <option value="name-asc">Nombre A-Z</option>
                    <option value="name-desc">Nombre Z-A</option>
                    <option value="price-asc">Precio ↑</option>
                    <option value="price-desc">Precio ↓</option>
                </select>
            </div>
        </div>

        <div class="categories" id="categories" role="group" aria-label="Categorías de productos"></div>

        <div id="productsContainer"></div>
        
        <div class="no-results" id="noResults" style="display: none;" role="status">
            No se encontraron productos
        </div>
    </div>

    <button class="toggle-calc-btn" id="toggleCalcBtn" onclick="toggleCalculator()" aria-label="Abrir calculadora">
        🧮 Calculadora
        <span class="cart-badge" id="cartBadge">0</span>
    </button>

    <div class="calculator-panel" id="calculatorPanel" role="dialog" aria-label="Calculadora de precios">
        <div class="calculator-header">
            <h3>🧮 Calculadora de Precios</h3>
            <button class="close-calc" onclick="toggleCalculator()" aria-label="Cerrar calculadora">Cerrar</button>
        </div>
        <div class="calculator-content">
            <div class="selected-products" id="selectedProducts" role="list"></div>
            <div class="total-section">
                <h4>📊 Resumen Total</h4>
                <div class="total-items" id="totalItems"></div>
                <div class="total-final">
                    <span>TOTAL:</span>
                    <span id="totalFinal">$0.00</span>
                </div>
                <div class="action-buttons">
                    <button class="whatsapp-btn" id="whatsappBtn" onclick="compartirWhatsApp()" aria-label="Enviar pedido por WhatsApp">
                        <span style="font-size: 1.5em;">📱</span>
                        Enviar por WhatsApp
                    </button>
                    <button class="pdf-btn" id="pdfBtn" onclick="exportPDF()" aria-label="Exportar pedido como PDF">
                        <span style="font-size: 1.5em;">📄</span>
                        Exportar PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
